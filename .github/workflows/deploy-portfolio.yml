name: Publish portfolio to GitHub Pages

on:
  push:
    branches: ["**"]
    paths:
      - "public/portfolio/**"
      - "src/assets/**"
      - "scripts/export-portfolio.mjs"
      - "scripts/refresh-medium.py"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Export images and videos for GitHub Pages
        run: node scripts/export-portfolio.mjs "$RUNNER_TEMP/portfolio-pages"

      - name: Refresh Medium articles
        run: python3 scripts/refresh-medium.py "$RUNNER_TEMP/portfolio-pages/medium-posts.json"

      - name: Upload the static portfolio
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/portfolio-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5